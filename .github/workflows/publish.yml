name: Publish Quarto book

# Build the book and deploy it to GitHub Pages on every push to main. The
# install and the render are those of the "book" job in check.yml: the
# environment from uv.lock and the same pinned Quarto. The book imports the
# installed primes_in_intervals package and executes its code cells; slow
# computations are embedded as precomputed images from images/.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Install from the lock
        run: uv sync --locked --extra dev

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      # Quarto renders the project rooted at _quarto.yml in the repository
      # root, writing the site to _book.
      - name: Render the book
        run: uv run --locked quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
