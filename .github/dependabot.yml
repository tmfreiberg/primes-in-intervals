# Dependency updates as pull requests, grouped and monthly: one for the
# Python packages in uv.lock, one for the actions the workflows use.
# Security updates still come at once, when enabled in the repository's
# settings. Quarto is pinned in the workflows and is not updated here.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
