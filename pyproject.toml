[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primes-in-intervals"
version = "1.2.0"
description = "Counting primes in intervals: computation, SQLite storage, statistics, predictions, and animations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tristan Freiberg" }]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    # The 30-digit cross-check of the quadrature (pii quadrature-check).
    "mpmath",
    # pandas needs jinja2 for the .style accessor, which display() and
    # show_table() use whenever a caption is attached (their default).
    "jinja2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    # What Quarto needs to execute the book's Python cells.
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
    "pyyaml",
]

[project.scripts]
primes-in-intervals = "primes_in_intervals.cli:main"
pii = "primes_in_intervals.cli:main"

[project.urls]
Repository = "https://github.com/tmfreiberg/primes-in-intervals"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "E741",  # ambiguous variable names: mathematical notation (l, I) is deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "pandas.*", "mpmath.*"]
ignore_missing_imports = true

[tool.deptry]
known_first_party = ["primes_in_intervals"]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# Not imported: pandas uses it for the .style accessor (see dependencies).
DEP002 = ["jinja2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # The plotting tests build animations and discard them without saving,
    # which is the behavior under test; Matplotlib warns about this when the
    # object is garbage-collected, at an arbitrary later point in the run.
    "ignore:Animation was deleted without rendering anything:UserWarning",
]
